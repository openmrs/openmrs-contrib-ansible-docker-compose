# llama.cpp Router Mode model presets for emr-3-ai-hub.
# Models are stored in the persistent `llm-models` Docker volume mounted at
# /models (written/verified on demand or via MED_AGENT_PRELOAD_MODELS by
# med-agent-hub, mounted read-only into llama-router).

[*]
ngl = 99
ctx-size = 24576
parallel = 1
batch-size = 4096
ubatch-size = 1024
temp = 0
seed = 42
dry-multiplier = 0
dry-base = 1.75
dry-allowed-length = 8
dry-penalty-last-n = 24576
reasoning-budget = 0

# Default compact presets (~3-4 GB GGUFs) suitable for modest CPU/RAM hosts.
[gemma-e4b]
model = /models/gemma-e4b.gguf

[gemma-e2b]
model = /models/gemma-e2b.gguf

# Uncomment on GPU or high-RAM hosts to enable larger models in med-agent-hub
# profiles (remember to update MED_AGENT_PRELOAD_MODELS / LLAMA_ROUTER_MODELS_MAX
# in .env accordingly).
