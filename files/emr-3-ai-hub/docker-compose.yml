services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:${TAG:-nightly-chartsearch}
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "${GATEWAY_PORT:-8889}:80"

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:${TAG:-nightly-chartsearch}
    restart: always
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_DEFAULT_LOCALE:

  backend:
    image: openmrs/openmrs-reference-application-3-backend:${TAG:-nightly-chartsearch}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      hiv-baseline-db:
        condition: service_completed_successfully
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      OMRS_EXTRA_OPTIMIZED_STARTUP: "false"
      OMRS_EXTRA_QUERYSTORE_BACKEND: elasticsearch
      OMRS_EXTRA_QUERYSTORE_ELASTICSEARCH_URI: http://elasticsearch:9200
      CHARTSEARCHAI_DEMO_DUMP_URL: ${CHARTSEARCHAI_DEMO_DUMP_URL:-file:///managed-by-hiv-baseline-init}
      OMRS_EXTRA_CHARTSEARCHAI_LLM_REMOTE_APIKEY: ${OMRS_EXTRA_CHARTSEARCHAI_LLM_REMOTE_APIKEY:-}
      OMRS_EXTRA_CHARTSEARCHAI_HUB_APIKEY: ${CHARTSEARCH_HUB_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs/health/started"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 900s
    volumes:
      - openmrs-data:/openmrs/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      path.repo: /snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-snapshots:/snapshots

  hiv-db-probe:
    image: mariadb:10.11
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/config/restore-hiv-db.sh", "probe"]
    environment:
      DB_HOST: db
      OMRS_DB_NAME: openmrs
      RESTORE_DB_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
      OMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      HIV_BASELINE_ENABLED: ${HIV_BASELINE_ENABLED:-true}
    volumes:
      - ./config/restore-hiv-db.sh:/config/restore-hiv-db.sh:ro
      - baseline-staging:/staging
    healthcheck:
      disable: true

  hiv-baseline-stage:
    image: ghcr.io/pmanko/med-agent-hub:${HUB_TAG:-latest}
    platform: linux/amd64
    user: "0:0"
    depends_on:
      elasticsearch:
        condition: service_healthy
      hiv-db-probe:
        condition: service_completed_successfully
    entrypoint: ["python", "/config/restore-hiv-baseline.py"]
    environment:
      HIV_BASELINE_ENABLED: ${HIV_BASELINE_ENABLED:-true}
      HIV_BASELINE_IMAGE: ${HIV_BASELINE_IMAGE:-ghcr.io/pmanko/openclinai-hiv-baseline@sha256:6d828211831ef5bf1d37955bf024bc422383a63b9af728d1fa40e4c1acbd5394}
      ES_URL: http://elasticsearch:9200
      STAGING_DIR: /staging
      SNAPSHOT_DIR: /snapshots
      OPENMRS_DATA_DIR: /openmrs/data
    volumes:
      - ./config/restore-hiv-baseline.py:/config/restore-hiv-baseline.py:ro
      - baseline-staging:/staging
      - es-snapshots:/snapshots
      - openmrs-data:/openmrs/data
    healthcheck:
      disable: true

  hiv-baseline-db:
    image: mariadb:10.11
    depends_on:
      db:
        condition: service_healthy
      hiv-baseline-stage:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/config/restore-hiv-db.sh", "restore"]
    environment:
      DB_HOST: db
      OMRS_DB_NAME: openmrs
      OMRS_DB_USER: ${OMRS_DB_USER:-openmrs}
      RESTORE_DB_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
      OMRS_DB_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      HIV_BASELINE_ENABLED: ${HIV_BASELINE_ENABLED:-true}
      HIV_BASELINE_IMAGE: ${HIV_BASELINE_IMAGE:-ghcr.io/pmanko/openclinai-hiv-baseline@sha256:6d828211831ef5bf1d37955bf024bc422383a63b9af728d1fa40e4c1acbd5394}
    volumes:
      - ./config/restore-hiv-db.sh:/config/restore-hiv-db.sh:ro
      - baseline-staging:/staging
    healthcheck:
      disable: true

  db:
    image: mariadb:10.11
    restart: always
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mariadb", "--user=${OMRS_DB_USER:-openmrs}", "--password=${OMRS_DB_PASSWORD:-openmrs}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - db-data:/var/lib/mysql

  # Ensure the shared model volume is writable by med-agent-hub (uid/gid 65532)
  # before llama-router mounts it read-only.
  models-init:
    image: ghcr.io/pmanko/med-agent-hub:${HUB_TAG:-latest}
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["chown", "-R", "65532:65532", "/app/models"]
    volumes:
      - llm-models:/app/models
    healthcheck:
      disable: true

  llama-router:
    image: ghcr.io/ggml-org/llama.cpp@sha256:6bc9134e3278a0ecab23d7ef2f6a46b4595740014fe9bc2f67e8ba7dca8395b4
    restart: always
    depends_on:
      models-init:
        condition: service_completed_successfully
    environment:
      HF_HOME: /tmp/empty-hf
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8077"
      - --models-preset
      - /config/llama-router.ini
      - --models-max
      - "${LLAMA_ROUTER_MODELS_MAX:-2}"
      - --jinja
    volumes:
      - ./router/llama-router.ini:/config/llama-router.ini:ro
      - llm-models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8077/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  med-agent-hub:
    image: ghcr.io/pmanko/med-agent-hub:${HUB_TAG:-latest}
    platform: linux/amd64
    restart: always
    depends_on:
      models-init:
        condition: service_completed_successfully
      llama-router:
        condition: service_healthy
    environment:
      HUB_API_KEY: ${CHARTSEARCH_HUB_API_KEY:-}
      LLM_PROVIDER: ${MED_AGENT_LLM_PROVIDER:-openai-compatible}
      LLM_BASE_URL: ${MED_AGENT_LLM_BASE_URL:-http://llama-router:8077}
      LLM_API_KEY: ${MED_AGENT_LLM_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL_MAP: ${MED_AGENT_LLM_MODEL_MAP:-}
      LLM_TOKENIZER_MODE: ${MED_AGENT_TOKENIZER_MODE:-auto}
      LLM_TEMPERATURE: ${MED_AGENT_TEMPERATURE:-0.0}
      LLAMA_MODEL_DIR: /app/models
      MED_AGENT_PRELOAD_MODELS: ${MED_AGENT_PRELOAD_MODELS:-gemma-4-12b}
      HUB_ANCHOR: ${HUB_ANCHOR:-}
      HUB_TIMEZONE: ${HUB_TIMEZONE:-UTC}
      QUERYSTORE_BASE_URL: ${QUERYSTORE_BASE_URL:-http://backend:8080/openmrs}
      QUERYSTORE_USERNAME: ${QUERYSTORE_USERNAME:-med-agent-hub}
      QUERYSTORE_PASSWORD: ${QUERYSTORE_PASSWORD:-}
    volumes:
      - llm-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  hub-config-init:
    image: ghcr.io/pmanko/med-agent-hub:${HUB_TAG:-latest}
    platform: linux/amd64
    depends_on:
      backend:
        condition: service_healthy
      med-agent-hub:
        condition: service_healthy
    entrypoint: ["python", "/config/configure-openmrs.py"]
    environment:
      OMRS_BASE_URL: http://backend:8080/openmrs
      OMRS_ADMIN_USER: ${OMRS_ADMIN_USER:-admin}
      OMRS_ADMIN_PASSWORD: ${OMRS_ADMIN_PASSWORD:-Admin123}
      QUERYSTORE_USERNAME: ${QUERYSTORE_USERNAME:-med-agent-hub}
      QUERYSTORE_PASSWORD: ${QUERYSTORE_PASSWORD:-}
      CHARTSEARCH_HUB_ENDPOINT_URL: ${CHARTSEARCH_HUB_ENDPOINT_URL:-http://med-agent-hub:8080/v1/chat/completions}
      CHARTSEARCH_PROVIDERS_ENABLED: ${CHARTSEARCH_PROVIDERS_ENABLED:-bundled,hub}
      CHARTSEARCH_PROVIDERS_DEFAULT: ${CHARTSEARCH_PROVIDERS_DEFAULT:-hub}
      CHARTSEARCH_BUNDLED_ENGINE: ${CHARTSEARCH_BUNDLED_ENGINE:-remote}
      CHARTSEARCH_BUNDLED_ENDPOINT_URL: ${CHARTSEARCH_BUNDLED_ENDPOINT_URL:-http://llama-router:8077/v1/chat/completions}
      CHARTSEARCH_BUNDLED_MODEL_NAME: ${CHARTSEARCH_BUNDLED_MODEL_NAME:-gemma-4-12b}
      CHARTSEARCHAI_REFERENCE_DATE: ${CHARTSEARCHAI_REFERENCE_DATE:-}
      HUB_BASE_URL: http://med-agent-hub:8080
      CHARTSEARCH_HUB_API_KEY: ${CHARTSEARCH_HUB_API_KEY:-}
      EVALUATION_PASSWORD: ${EVALUATION_PASSWORD:-}
      HIV_BASELINE_ENABLED: ${HIV_BASELINE_ENABLED:-true}
      VERIFY_SAMPLE_PATIENT_UUID: ${VERIFY_SAMPLE_PATIENT_UUID:-}
      QUERYSTORE_INDEX_TIMEOUT_SECONDS: ${QUERYSTORE_INDEX_TIMEOUT_SECONDS:-600}
    volumes:
      - ./config/configure-openmrs.py:/config/configure-openmrs.py:ro
    healthcheck:
      disable: true

  # Grafana monitoring stack
  monitoring-init:
    image: openmrs/openmrs-reference-application-3-monitoring-init:dev3
    volumes:
      - loki-data:/loki/data
      - loki-config:/etc/loki
      - alloy-config:/etc/alloy
      - grafana-provisioning:/etc/grafana/provisioning

  loki:
    image: grafana/loki:3.6
    restart: always
    volumes:
      - loki-config:/etc/loki
      - loki-data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      monitoring-init:
        condition: service_completed_successfully

  alloy:
    image: grafana/alloy:v1.13.1
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-config:/etc/alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy
    depends_on:
      monitoring-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:12.3
    restart: always
    environment:
      GF_LOG_LEVEL: warn
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Admin123}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/logs-dashboard.json
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      monitoring-init:
        condition: service_completed_successfully

volumes:
  openmrs-data: ~
  db-data: ~
  es-data: ~
  es-snapshots: ~
  baseline-staging: ~
  llm-models: ~
  grafana-data: ~
  loki-data: ~
  loki-config: ~
  alloy-config: ~
  grafana-provisioning: ~
