services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
    healthcheck:
      test: "pg_isready -U postgres"
    restart: "always"
    volumes:
      - postgres_data:/var/lib/postgresql

  keycloak:
    image: openmrsinfra/openmrs-id-keycloak:production
    depends_on:
      - db
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT}
      KC_CACHE: local
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-postgres}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS:-xforwarded}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin123}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    healthcheck:
      test: curl --head -fsSk https://localhost:9000/health/ready || exit 1
    restart: "always"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json

  postfix:
    image: openmrsinfra/openmrs-id-postfix:production
    ports:
      - "587:25"
      - "25:25"
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: postfix status
    restart: "always"
    environment:
      POSTFIX_MYHOSTNAME: ${POSTFIX_HOSTNAME:-smtp.openmrs.org}
      POSTFIX_MYDOMAIN: ${POSTFIX_MYDOMAIN:-id.openmrs.org}
      POSTFIX_MYNETWORKS: ${POSTFIX_MYNETWORKS:-}
      POSTFIX_USERNAME: ${POSTFIX_USERNAME:-username}
      POSTFIX_PASSWORD: ${POSTFIX_PASSWORD:-password}
      POSTFIX_TLS_CRT_FILENAME: ${POSTFIX_SSL_CERT:-fullchain.pem}
      POSTFIX_TLS_KEY_FILENAME: ${POSTFIX_SSL_CERT_KEY:-privkey.pem}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.server.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-smtp}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-Smtp123}
      LDAP_HOST: ${LDAP_HOST:-ldaps://ldap.openmrs.org}
      LDAP_PORT: ${LDAP_PORT:-636}
      LDAP_USER: ${LDAP_USER:-ldap}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-Ldap123}
      # IP Updater Configuration
      ATLASSIAN_IP_JSON_URL: ${ATLASSIAN_IP_JSON_URL:-https://ip-ranges.atlassian.com/}
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      DATADOG_APP_KEY: ${DATADOG_APP_KEY}
      DATADOG_SITE: ${DATADOG_SITE:-datadoghq.com}
      DATADOG_HOSTNAME: adaba.openmrs.org
      IP_CHECK_INTERVAL: ${IP_CHECK_INTERVAL:-3600}
      HEALTH_PORT: ${HEALTH_PORT:-8090}
      METRIC_REPORT_INTERVAL: ${METRIC_REPORT_INTERVAL:-300}
    volumes:
      - /etc/letsencrypt/live/adaba.openmrs.org:/etc/ssl/certs/
      - /etc/letsencrypt/archive/adaba.openmrs.org:/etc/archive/adaba.openmrs.org
      - ip_updater_logs:/var/log/ip_updater/

  authentik-db-init:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      AUTHENTIK_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$AUTHENTIK_DB'" | grep -q 1
        || psql -c "CREATE DATABASE \"$$AUTHENTIK_DB\""
    restart: "no"

  authentik-server:
    image: openmrsinfra/openmrs-id-authentik:production
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-postgres}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_WEB__PATH: ${AUTHENTIK_WEB__PATH:-/}
    ports:
      # Admin UI only; nothing outside the host needs to reach authentik
      - "127.0.0.1:9000:9000"
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
    restart: "always"
    shm_size: 512mb

  authentik-worker:
    image: openmrsinfra/openmrs-id-authentik:production
    command: worker
    environment:
      <<: *authentik-env
      # Password for the akadmin user; only applied on the first start against an empty database
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_WORKER__THREADS: ${AUTHENTIK_WORKER_THREADS:-4}
      AUTHENTIK_LDAP_URL: ${AUTHENTIK_LDAP_URL:-}
      AUTHENTIK_LDAP_BIND_DN: ${AUTHENTIK_LDAP_BIND_DN:-}
      AUTHENTIK_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      ATLASSIAN_SCIM_URL: ${ATLASSIAN_SCIM_URL:-}
      ATLASSIAN_SCIM_TOKEN: ${ATLASSIAN_SCIM_TOKEN:-}
      ATLASSIAN_EMAIL_DOMAIN: ${ATLASSIAN_EMAIL_DOMAIN:-}
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
    restart: "always"
    shm_size: 512mb

volumes:
  postgres_data:
    driver: local
  ip_updater_logs:
    driver: local
