# LiteLLM gateway config. All credentials are `os.environ/...` references resolved from
# secrets/litellm.env, which is mounted only into the litellm container.

# fast / balanced / strong are provider-neutral names; the actual models come from LLM_MODEL_* in
# secrets/litellm.env. No api_key is set, so LiteLLM uses each provider's standard key variable
# (ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, ...).
#
# Agents normally ask for `auto`, which picks one of them per request. See tier_classifier.py for
# how the tier is chosen.
#
# cache_control_injection_points turns on provider prompt caching for providers that use explicit
# cache markers (Anthropic, Bedrock Claude, ...); LiteLLM skips it for others. Agents ask for
# `auto`, which Hermes doesn't recognize as Claude, so Hermes adds no markers itself. The system
# message marker caches tools + system prompt; the last-message marker caches the conversation so
# far for the next turn. The cache is per model, so a turn routed to a different tier starts cold.
model_list:
  - model_name: fast
    litellm_params:
      model: os.environ/LLM_MODEL_FAST
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
  - model_name: balanced
    litellm_params:
      model: os.environ/LLM_MODEL_BALANCED
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
  - model_name: strong
    litellm_params:
      model: os.environ/LLM_MODEL_STRONG
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
  # TypeSafe's Jev decision model, used only by the `auto` router's Jev classifier (agents' keys
  # can't call it). LiteLLM reads TYPESAFE_API_KEY, and TYPESAFE_API_BASE if set, itself.
  - model_name: jev-router
    litellm_params:
      model: typesafe/jev-latest
  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        classifier_type: custom
        classifier_plugin: tier_classifier.classifier
        # Must cover the per-classifier timeouts in tier_classifier.py run back to back.
        classifier_plugin_timeout_ms: 7000
        classifier_fallback: heuristic
        tiers:
          SIMPLE: fast
          MEDIUM: balanced
          COMPLEX: balanced
          REASONING: strong

# Rovo is exposed once per Atlassian service account: rovo_read reads Jira and Confluence, and each
# write server can also write to its one product. Access is enforced by the scopes on those service
# accounts; which agent may use which server is set per virtual key by the admin tool
# (object_permission.mcp_servers).
mcp_servers:
  rovo_read:
    url: https://mcp.atlassian.com/v2/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/ROVO_READ_API_KEY
  rovo_jira_write:
    url: https://mcp.atlassian.com/v2/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/ROVO_JIRA_WRITE_API_KEY
  rovo_confluence_write:
    url: https://mcp.atlassian.com/v2/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/ROVO_CONFLUENCE_WRITE_API_KEY
  # Runs builds and tests of openmrs repositories (sandbox/server.py). Needs no credential: only
  # LiteLLM can reach it, and it holds nothing worth protecting.
  sandbox:
    url: http://sandbox:8080/mcp
    transport: http

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Keys get no MCP servers unless explicitly granted, instead of inheriting team defaults.
  require_key_mcp_access_defined: true
  store_model_in_db: true
  # Spend logs hold per-request metadata (key, model, tokens, cost), not prompts or replies. A daily
  # job deletes rows older than this; daily spend totals are kept.
  maximum_spend_logs_retention_period: 120d
