name: hermes

# Third-party images are pinned by tag and digest. The openmrsinfra/hermes* images are built from
# https://github.com/openmrs/openmrs-contrib-hermes-agent, and the config files in this directory
# are copied from the same commit; see "Upgrading" in README.md before changing any of them.

# Caps each container's log at 30 MB (3 files of 10 MB).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-hermes-agent: &hermes-agent
  image: openmrsinfra/hermes:nightly
  restart: always
  logging: *logging
  # The container starts as root only to set up the agent's home, then drops to the Hermes user.
  # no-new-privileges stops anything the agent runs from regaining root through setuid binaries.
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
  command: ["gateway", "run"]
  networks: [agents]
  depends_on:
    litellm:
      condition: service_healthy
  environment:
    HERMES_UID: ${HERMES_UID:-10000}
    HERMES_GID: ${HERMES_GID:-10000}
    # The github_pr App's bot account, from ./.env; commits fail until both are set (see README.md).
    GIT_AUTHOR_NAME: ${GIT_BOT_NAME:-}
    GIT_AUTHOR_EMAIL: ${GIT_BOT_EMAIL:-}
    GIT_COMMITTER_NAME: ${GIT_BOT_NAME:-}
    GIT_COMMITTER_EMAIL: ${GIT_BOT_EMAIL:-}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: always
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    networks: [litellm-db]
    env_file: secrets/postgres.env
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.106.4@sha256:db36453d25e76c9eb689d7d51b8e5fa48843243d7a86ed1284cf574ce0107b3f
    restart: always
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [agents, litellm-db, admin, sandbox]
    env_file: [secrets/litellm.env, secrets/master.env]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/tier_classifier.py:/app/tier_classifier.py:ro
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Mints short-lived GitHub App installation tokens for agents' `gh`
  github-token:
    image: openmrsinfra/hermes-github-token:nightly
    restart: always
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    networks: [agents]
    env_file:
      - path: secrets/github-app.env
        required: false
    volumes:
      - ./github-token/levels.json:/app/levels.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Builds and tests openmrs repositories for agents, as the `sandbox` MCP server in LiteLLM (see
  # sandbox/server.py). Builds run as an unprivileged user, and everything a job leaves outside
  # /cache is removed when it ends. Holds no secrets and mounts no agent data.
  sandbox:
    image: openmrsinfra/hermes-sandbox:nightly
    restart: always
    logging: *logging
    # An init process reaps the build processes the server kills.
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Runs as root only to start builds as the build user, and to kill and clean up after them.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    networks: [sandbox]
    volumes:
      # Job directories, emptied after every job.
      - sandbox-work:/work
      # Maven, npm, Yarn, pnpm, and Corepack caches, kept between jobs.
      - sandbox-cache:/cache
    mem_limit: 4g
    cpus: 2
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Manages agents' keys, MCP and GitHub access, and Slack settings. Not started by
  # `docker compose up`; run it with `docker compose run --rm admin` (interactive) or
  # `... admin <command>`.
  admin:
    image: openmrsinfra/hermes-admin:nightly
    profiles: [admin]
    # Runs as root to create agents' directories and hand them to the Hermes user, and to read
    # their .env files (mode 600, owned by that user).
    security_opt: [no-new-privileges:true, label=disable]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs: [/tmp]
    networks: [admin]
    env_file: secrets/master.env
    environment:
      LITELLM_URL: http://litellm:4000
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    volumes:
      - agents-data:/agents
      - ./github-token/levels.json:/templates/github-levels.json:ro
    depends_on:
      litellm:
        condition: service_healthy

  # One service per agent, named agent-<name>
  agent-default:
    <<: *hermes-agent
    volumes:
      - type: volume
        source: agents-data
        target: /opt/data
        volume:
          subpath: default
      - type: volume
        source: agents-data
        target: /opt/data/.env
        read_only: true
        volume:
          subpath: default/.env
      - ./hermes/souls/default.md:/opt/data/SOUL.md:ro
      - ./hermes/config.yaml:/opt/data/config.yaml:ro

networks:
  agents: {}
  litellm-db:
    internal: true
  admin:
    internal: true
  sandbox: {}

volumes:
  postgres-data: {}
  sandbox-work: {}
  sandbox-cache: {}
  # One subdirectory per agent (its Hermes home, including .env). Only the admin container mounts
  # the whole volume.
  agents-data: {}
