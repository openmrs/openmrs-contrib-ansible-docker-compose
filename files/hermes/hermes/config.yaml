# Shared by every agent and mounted read-only, so neither the agent nor text it reads can change it
# (e.g. to redirect requests). Hermes commands that write config (`/model --global`) fail. Changes
# apply on agent restart.

# Hermes migrates older configs at startup by rewriting this stamp, which it can't do read-only, so
# keep it at the compose.yaml image's version (see the upgrade checklist below).
_config_version: 51

model:
  provider: litellm
  default: auto
  # Hermes can't look up `auto`'s window. Tier models have 1M-token windows but degrade past ~500k,
  # so history is compacted before then.
  context_length: 768000
  # Must match providers.litellm.base_url, or Hermes silently ignores context_length and assumes 256k.
  base_url: http://litellm:4000/v1

providers:
  litellm:
    base_url: http://litellm:4000/v1
    key_env: LITELLM_API_KEY
    session_affinity_header: x-litellm-session-id

# Side tasks (titles, compression, vision, ...) use `fast`, not the `auto` router. There's no global
# setting and an unlisted task silently falls back to `auto`, so list every one.
#
# CHECK ON EVERY HERMES UPGRADE (HERMES_IMAGE in compose.yaml): new versions can add side tasks.
#   1. Run tests/run.sh; its side-task check fails on any task the image knows that isn't listed here.
#   2. Add each reported task as `<task>: *fast`.
#   3. Set _config_version to the image's version, which tests/run.sh also reports.
auxiliary:
  vision: &fast
    provider: litellm
    model: fast
  approval: *fast
  background_review: *fast
  call: *fast
  compression: *fast
  curator: *fast
  goal_judge: *fast
  kanban_decomposer: *fast
  kanban_estimator: *fast
  mcp: *fast
  memory_query_rewrite: *fast
  moa_aggregator: *fast
  moa_reference: *fast
  monitor: *fast
  profile_describer: *fast
  review: *fast
  skills_hub: *fast
  title_generation: *fast
  triage_specifier: *fast
  tts_audio_tags: *fast
  voice_chat: *fast

# Caps model calls per run so a runaway task can't spend the monthly budget. At 80% Hermes tells the
# model to wrap up rather than cutting it off mid-task.
agent:
  max_turns: 50
  budget_warning_ratio: 0.8

# The terminal, file tools, and execute_code run over SSH in the agent's own workspace
# (TERMINAL_SSH_HOST in compose.yaml), not here. Only the host key the admin tool writes to
# ssh/known_hosts is trusted (see hermes/image).
#
# The workspace resets when idle (see workspace/supervisor.py). A session whose directory was removed
# fails every command until it recreates it (SOUL.md says how).
terminal:
  backend: ssh
  ssh_user: workspace
  ssh_port: 2222
  ssh_key: /opt/data/ssh/id_ed25519
  cwd: /work/home

# USER.md is one profile per agent, not per person, added to every prompt; in shared Slack spaces
# anything saved about one person would reach everyone, so it's off. MEMORY.md (agent notes) stays
# on; SOUL.md limits what goes in.
memory:
  user_profile_enabled: false

# Sessions (all messages and tool calls, in state.db) are deleted 30 days after they end, checked at
# most daily.
sessions:
  auto_prune: true
  retention_days: 30

# One entry per MCP server in litellm/config.yaml. LiteLLM adds the server's credential (never seen
# by the agent) and refuses servers this key hasn't been granted.
#
# strict_redirect_headers keeps the key from following a redirect and stops Hermes retrying a
# refused server over SSE, which LiteLLM leaves hanging until Hermes' connect timeout.
#
# `trust: untrusted` makes Hermes ask for Slack approval before any tool not annotated read-only,
# and block it if no one approves, so text in an issue, page, or PR can't make the agent write to
# Jira or Confluence unseen.
mcp_servers:
  rovo_read:
    url: http://litellm:4000/mcp/rovo_read
    strict_redirect_headers: true
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  rovo_jira_write:
    url: http://litellm:4000/mcp/rovo_jira_write
    strict_redirect_headers: true
    trust: untrusted
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
  rovo_confluence_write:
    url: http://litellm:4000/mcp/rovo_confluence_write
    strict_redirect_headers: true
    trust: untrusted
    headers:
      x-litellm-api-key: "Bearer ${LITELLM_API_KEY}"
